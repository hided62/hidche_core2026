packages:
  - packages/*
  - app/*
  - tools/*

overrides:
  deepmerge-ts: 8.0.1
  mysql2: 3.23.1
  basic-ftp: 6.2.1
  ip-address: 10.7.1
  source-map-js: 1.2.2
  prosemirror-view: 1.42.3
  postcss-selector-parser: 7.1.6
  'vitepress>vite': 6.4.3
  'vue@>=3.5.0 <3.5.42': 3.5.43
  'brace-expansion@>=4.0.0 <6.0.0': 5.0.12
  fast-uri: 3.1.8
  js-yaml: 4.3.2
  lodash: 4.18.1
  postcss: 8.5.26
  rolldown-plugin-dts: 0.27.13
  typescript: 6.0.3

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true

minimumReleaseAgeExclude:
  - eslint@10.8.1
  - '@playwright/test@1.62.1'
  - playwright-core@1.62.1
  - playwright@1.62.1
  - globals@17.11.0
  - '@turbo/darwin-64@2.11.3'
  - '@turbo/darwin-arm64@2.11.3'
  - '@turbo/linux-64@2.11.3'
  - '@turbo/linux-arm64@2.11.3'
  - '@turbo/windows-64@2.11.3'
  - '@turbo/windows-arm64@2.11.3'
  - turbo@2.11.3

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
  - vue-demi
