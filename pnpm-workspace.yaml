packages:
  - packages/*
  - app/*
  - tools/*

overrides:
  deepmerge-ts: 8.0.1
  fast-uri: 3.1.5
  js-yaml: 4.3.1
  lodash: 4.18.1
  postcss: 8.5.26
  typescript: 6.0.3

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true

minimumReleaseAgeExclude:
  - eslint@10.8.1
  - '@playwright/test@1.62.1'
  - playwright-core@1.62.1
  - playwright@1.62.1
  - globals@17.11.0

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
  - vue-demi
